services:
  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./pages/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./pages:/usr/share/nginx/pages:ro
    depends_on:
      ssoapp:
        condition: service_started
      chatapp:
        condition: service_started
    networks:
      - front-back-network

  kafka:
    image: apache/kafka:latest
    ports:
      - "9094:9094"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_LOG_DIRS=/tmp/kraft-combined-logs
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    networks:
      - eventqueue-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "9000:9000"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - eventqueue-network

  ssodb:
    image: postgres:17
    restart: always
    env_file:
      - ./sso-service/.env
    ports:
      - "5433:5432"
    volumes:
      - sso_pgdata:/var/lib/postgresql/data
      - ./sso-service/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sso-network

  ssoapp:
    build:
      context: ./sso-service
      dockerfile: Dockerfile
    restart: on-failure
    depends_on:
      ssodb:
        condition: service_healthy
    env_file:
      - ./sso-service/.env
      - .env
    ports:
      - "8081:8081"
      - "50051:50051"
    networks:
      - sso-network
      - eventqueue-network
      - front-back-network

  chatdb:
    image: postgres:17
    restart: always
    env_file:
      - ./chat-service/.env
    ports:
      - "5432:5432"
    volumes:
      - chat_pgdata:/var/lib/postgresql/data
      - ./chat-service/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chat-network

  chatredis:
    image: redis:8
    restart: always
    command: [
      "redis-server",
      "--maxmemory", "512mb",
      "--maxmemory-policy", "allkeys-lru"
    ]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chat-network

  chatapp:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    restart: on-failure
    depends_on:
      chatdb:
        condition: service_healthy
    env_file:
      - ./chat-service/.env
      - .env
    ports:
      - "8080:8080"
    networks:
      - chat-network
      - eventqueue-network
      - front-back-network

networks:
  front-back-network:
    driver: bridge
  eventqueue-network:
    driver: bridge
  chat-network:
    driver: bridge
  sso-network:
    driver: bridge

volumes:
  sso_pgdata:
  chat_pgdata: